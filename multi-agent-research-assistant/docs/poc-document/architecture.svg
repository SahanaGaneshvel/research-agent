<text x="24" y="478" font-size="12" font-weight="700" fill="#2B2828" text-anchor="start" letter-spacing="1.5">CHECK AND WRITE THE REPORT</text>
<line x1="1061.0" y1="450" x2="1061.0" y2="488" stroke="#2B2828" stroke-width="1.6"/><path d="M1056.0 480 L1061.0 489 L1066.0 480" fill="none" stroke="#2B2828" stroke-width="1.6" stroke-linecap="round"/>
