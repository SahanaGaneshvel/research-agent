<text x="76" y="576" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">report_&lt;time&gt;.md</text>
<text x="76" y="598" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">10 sections, cited</text>
<text x="76" y="620" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">run_&lt;time&gt;.json</text>
<text x="76" y="642" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">every event, replayable</text>
<rect x="326" y="496" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<g transform="translate(344 516) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g>
<text x="378" y="534" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Check citations</text>
<line x1="378" y1="550" x2="570" y2="550" stroke="#2B2828" stroke-width="1"/>
<text x="378" y="576" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Unknown [S#] removed</text>
<text x="378" y="598" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Sentences crediting the</text>
<text x="378" y="620" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">wrong source removed</text>
<text x="378" y="642" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">References built by code</text>
<rect x="628" y="496" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2"/>
<g transform="translate(646 516) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
<text x="680" y="534" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Write</text>
<line x1="680" y1="550" x2="872" y2="550" stroke="#2B2828" stroke-width="1"/>
<text x="680" y="576" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Model writes the prose</text>
<text x="680" y="598" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Code builds every table</text>
<text x="680" y="620" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">and the methodology</text>
<text x="680" y="642" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Recommendations by rules</text>
<rect x="930" y="496" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2"/>
<g transform="translate(948 516) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></g>
<text x="982" y="534" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Evaluate</text>
