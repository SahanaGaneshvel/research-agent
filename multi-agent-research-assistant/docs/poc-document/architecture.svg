<text x="240.66666666666666" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">[S#] with no source,</text>
<text x="240.66666666666666" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">removed and counted</text>
<line x1="413.3333333333333" y1="752" x2="413.3333333333333" y2="822" stroke="#2B2828" stroke-width="1"/>
<text x="435.3333333333333" y="772" font-size="15" font-weight="700" fill="#2B2828" text-anchor="start">Verified benchmarks</text>
<text x="435.3333333333333" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">score found in the</text>
<text x="435.3333333333333" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">source it cites</text>
<line x1="608.0" y1="752" x2="608.0" y2="822" stroke="#2B2828" stroke-width="1"/>
