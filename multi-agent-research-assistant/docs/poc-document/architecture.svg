<text x="982" y="576" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Model proposes scores</text>
<text x="982" y="598" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Kept only if in the</text>
<text x="982" y="620" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">cited source</text>
<text x="982" y="642" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Memory estimated by code</text>
<line x1="318" y1="586.0" x2="300" y2="586.0" stroke="#2B2828" stroke-width="1.6"/><path d="M301 581.0 L292 586.0 L301 591.0" fill="none" stroke="#2B2828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="620" y1="586.0" x2="602" y2="586.0" stroke="#2B2828" stroke-width="1.6"/><path d="M603 581.0 L594 586.0 L603 591.0" fill="none" stroke="#2B2828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="922" y1="586.0" x2="904" y2="586.0" stroke="#2B2828" stroke-width="1.6"/><path d="M905 581.0 L896 586.0 L905 591.0" fill="none" stroke="#2B2828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
