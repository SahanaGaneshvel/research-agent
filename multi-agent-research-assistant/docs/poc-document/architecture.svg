<text x="608.0" y="734" font-size="17" font-weight="700" fill="#2B2828" text-anchor="middle">Quality measures, shown with every report</text>
<text x="46.0" y="772" font-size="15" font-weight="700" fill="#2B2828" text-anchor="start">Sources cited</text>
<text x="46.0" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">references that were</text>
<text x="46.0" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">really retrieved</text>
<line x1="218.66666666666666" y1="752" x2="218.66666666666666" y2="822" stroke="#2B2828" stroke-width="1"/>
