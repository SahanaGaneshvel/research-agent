<g transform="translate(344.0 886) scale(1.1666666666666667)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/></g>
<text x="390.0" y="900" font-size="16" font-weight="700" fill="#2B2828" text-anchor="start">Runs on</text>
