<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980" font-family="'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif">
  <!-- Editable source of the architecture diagram (GenAI Protos brand colours). -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2B2828"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1F5BF0"/>
    </marker>
  </defs>

  <rect width="1700" height="980" fill="#F7FAFF"/>

  <!-- title -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#2B2828">Multi-Agent AI Research Assistant: architecture</text>
  <text x="40" y="90" font-size="17" fill="#605C5C">One fixed LangGraph pipeline. The local model does the language work; code calls the tools, owns the citations and checks every fact.</text>

  <!-- ===================== retrieval tools ===================== -->
  <text x="900" y="130" text-anchor="middle" font-size="13" font-weight="600" letter-spacing="2" fill="#605C5C">RETRIEVAL TOOLS (RUN BY CODE, NOT BY THE MODEL)</text>
  <g font-size="16">
    <rect x="368" y="144" width="200" height="66" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
    <text x="468" y="172" text-anchor="middle" font-weight="700" fill="#2B2828">Web search</text>
    <text x="468" y="194" text-anchor="middle" font-size="13" fill="#605C5C">DuckDuckGo → Bing → Brave</text>

    <rect x="584" y="144" width="200" height="66" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
    <text x="684" y="172" text-anchor="middle" font-weight="700" fill="#2B2828">Hugging Face Hub API</text>
    <text x="684" y="194" text-anchor="middle" font-size="13" fill="#605C5C">model cards, licence, params</text>

    <rect x="800" y="144" width="200" height="66" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
    <text x="900" y="172" text-anchor="middle" font-weight="700" fill="#2B2828">arXiv API</text>
    <text x="900" y="194" text-anchor="middle" font-size="13" fill="#605C5C">paper abstracts</text>

    <rect x="1016" y="144" width="200" height="66" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
    <text x="1116" y="172" text-anchor="middle" font-weight="700" fill="#2B2828">GitHub REST API</text>
    <text x="1116" y="194" text-anchor="middle" font-size="13" fill="#605C5C">repos, README, licence</text>

    <rect x="1232" y="144" width="200" height="66" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
    <text x="1332" y="172" text-anchor="middle" font-weight="700" fill="#2B2828">Page fetcher</text>
    <text x="1332" y="194" text-anchor="middle" font-size="13" fill="#605C5C">Requests + BeautifulSoup</text>
  </g>
  <text x="40" y="168" font-size="13" fill="#605C5C">JSON file cache (24 h; empty</text>
  <text x="40" y="186" font-size="13" fill="#605C5C">results never cached) ·</text>
  <text x="40" y="204" font-size="13" fill="#605C5C">robots.txt respected</text>

  <!-- ===================== interfaces ===================== -->
  <rect x="40" y="300" width="260" height="360" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
  <text x="60" y="328" font-size="13" font-weight="600" letter-spacing="2" fill="#1F5BF0">INTERFACES</text>
  <rect x="60" y="346" width="220" height="62" rx="2" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="170" y="372" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2828">User</text>
  <text x="170" y="394" text-anchor="middle" font-size="13" fill="#605C5C">asks a research question</text>
  <path d="M170 408 V 428" stroke="#2B2828" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="60" y="432" width="220" height="62" rx="2" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="170" y="458" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2828">Streamlit app</text>
  <text x="170" y="480" text-anchor="middle" font-size="13" fill="#605C5C">app.py · live agent cards</text>
  <text x="170" y="516" text-anchor="middle" font-size="13" fill="#605C5C">or</text>
  <rect x="60" y="528" width="220" height="112" rx="2" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="170" y="556" text-anchor="middle" font-size="16" font-weight="700" fill="#2B2828">Next.js web app</text>
  <text x="170" y="578" text-anchor="middle" font-size="13" fill="#605C5C">flow diagram · live or replay</text>
  <text x="170" y="604" text-anchor="middle" font-size="13" fill="#605C5C">FastAPI · Server-Sent Events</text>
  <text x="170" y="626" text-anchor="middle" font-size="13" fill="#605C5C">(api/server.py)</text>

  <!-- ===================== LangGraph workflow ===================== -->
  <rect x="340" y="300" width="1120" height="360" rx="2" fill="#FFFFFF" stroke="#C7DAFF" stroke-width="1.5"/>
  <text x="360" y="328" font-size="13" font-weight="600" letter-spacing="2" fill="#1F5BF0">LANGGRAPH WORKFLOW</text>

  <!-- tools feed the Research Agent -->
  <g fill="none" stroke="#94A3B8" stroke-width="1.6">
    <path d="M468 210 C468 290 670 270 670 346"/>
    <path d="M684 210 C684 280 670 290 670 346"/>
    <path d="M900 210 C900 290 670 270 670 346"/>
    <path d="M1116 210 C1116 300 670 260 670 346"/>
    <path d="M1332 210 C1332 310 670 250 670 346"/>
  </g>
  <path d="M663 336 L670 350 L677 336 Z" fill="#94A3B8"/>

  <!-- interfaces → orchestrator -->
  <path d="M300 480 H 322 V 402 H 366" fill="none" stroke="#2B2828" stroke-width="1.6" marker-end="url(#arrow)"/>


  <!-- orchestrator (code) -->
  <rect x="370" y="352" width="170" height="100" rx="2" fill="#FFFFFF" stroke="#2B2828" stroke-width="1.6"/>
  <text x="455" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#2B2828">Orchestrator</text>
  <text x="455" y="410" text-anchor="middle" font-size="13" fill="#605C5C">validates the topic</text>
  <text x="455" y="430" text-anchor="middle" font-size="13" fill="#605C5C">checks Ollama + model</text>

  <!-- agents (navy = uses the model) -->
  <g>
    <rect x="580" y="352" width="180" height="100" rx="2" fill="#0B1B29"/>
    <text x="670" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Research Agent</text>
    <text x="670" y="410" text-anchor="middle" font-size="13" fill="#CBD5E1">plans, retrieves, reads</text>
    <text x="670" y="430" text-anchor="middle" font-size="13" fill="#CBD5E1">numbers sources S1…Sn</text>

    <rect x="790" y="352" width="180" height="100" rx="2" fill="#0B1B29"/>
    <text x="880" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Comparison Agent</text>
    <text x="880" y="410" text-anchor="middle" font-size="13" fill="#CBD5E1">one table row per model</text>
    <text x="880" y="430" text-anchor="middle" font-size="13" fill="#CBD5E1">licence category by code</text>

    <rect x="1000" y="352" width="180" height="100" rx="2" fill="#0B1B29"/>
    <text x="1090" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Evaluation Agent</text>
    <text x="1090" y="410" text-anchor="middle" font-size="13" fill="#CBD5E1">verifies benchmark scores</text>
    <text x="1090" y="430" text-anchor="middle" font-size="13" fill="#CBD5E1">memory estimates by code</text>

    <rect x="1210" y="352" width="220" height="100" rx="2" fill="#0B1B29"/>
    <text x="1320" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">Report Agent</text>
    <text x="1320" y="410" text-anchor="middle" font-size="13" fill="#CBD5E1">10-section Markdown report</text>
    <text x="1320" y="430" text-anchor="middle" font-size="13" fill="#CBD5E1">references built by code</text>
  </g>

  <!-- main sequence -->
  <g stroke="#2B2828" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M540 402 H 576"/>
    <path d="M760 402 H 786"/>
    <path d="M970 402 H 996"/>
    <path d="M1180 402 H 1206"/>
  </g>

  <!-- the only two branches -->
  <path d="M455 452 V 470" stroke="#605C5C" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="370" y="472" width="170" height="54" rx="2" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="455" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">can’t start → stop</text>
  <text x="455" y="514" text-anchor="middle" font-size="13" fill="#605C5C">with a clear message</text>
  <path d="M670 452 V 470" stroke="#605C5C" stroke-width="1.4" stroke-dasharray="4 4"/>
  <rect x="580" y="472" width="180" height="54" rx="2" fill="#FEF2F2" stroke="#FECACA"/>
  <text x="670" y="494" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">0 sources → honest</text>
  <text x="670" y="514" text-anchor="middle" font-size="13" fill="#605C5C">report, makes no claims</text>

  <!-- shared state -->
  <g stroke="#1F5BF0" stroke-width="1.4" stroke-dasharray="3 4">
    <path d="M455 526 V 552"/><path d="M670 526 V 552"/>
    <path d="M880 452 V 552"/><path d="M1090 452 V 552"/><path d="M1320 452 V 552"/>
  </g>
  <rect x="370" y="552" width="1060" height="84" rx="2" fill="#E0ECFF" stroke="#C7DAFF"/>
  <text x="390" y="582" font-size="16" font-weight="700" fill="#2B2828">Shared state (TypedDict)</text>
  <text x="390" y="606" font-size="13" fill="#2B2828">topic · sources S1…Sn · findings · comparison · evaluation · report · events</text>
  <text x="390" y="626" font-size="13" fill="#605C5C">Reducers merge agent status, timings and errors, so no agent overwrites another agent’s bookkeeping.</text>

  <!-- outputs -->
  <path d="M1430 402 H 1496" fill="none" stroke="#2B2828" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="1500" y="352" width="170" height="100" rx="2" fill="#FFFFFF" stroke="#2B2828" stroke-width="1.6"/>
  <text x="1585" y="386" text-anchor="middle" font-size="17" font-weight="700" fill="#2B2828">Outputs</text>
  <text x="1585" y="410" text-anchor="middle" font-size="13" fill="#605C5C">report_&lt;time&gt;.md</text>
  <text x="1585" y="430" text-anchor="middle" font-size="13" fill="#605C5C">run_&lt;time&gt;.json</text>

  <!-- ===================== local model ===================== -->
  <g stroke="#1F5BF0" stroke-width="1.6" stroke-dasharray="6 6">
    <path d="M670 660 V 716"/><path d="M880 660 V 716"/><path d="M1090 660 V 716"/><path d="M1320 660 V 716"/>
  </g>
  <text x="1336" y="694" font-size="13" fill="#1F5BF0">every agent calls the same local model</text>
  <rect x="580" y="720" width="850" height="96" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1005" y="756" text-anchor="middle" font-size="18" font-weight="700" fill="#2B2828">Local model · Ollama · Qwen3.5 (4B by default, 2B on an 8 GB laptop)</text>
  <text x="1005" y="784" text-anchor="middle" font-size="13" fill="#605C5C">Runs on the laptop, never online, no paid API · JSON-schema structured output + Pydantic validation · one bounded retry</text>
  <text x="1005" y="804" text-anchor="middle" font-size="13" fill="#605C5C">Cloud models (*-cloud) are refused</text>

  <!-- ===================== guards + legend ===================== -->
  <rect x="40" y="850" width="1630" height="94" rx="2" fill="#0B1B29"/>
  <text x="64" y="882" font-size="13" font-weight="600" letter-spacing="2" fill="#60A5FA">CODE-SIDE GUARDS</text>
  <text x="64" y="910" font-size="15" fill="#FFFFFF">Citation registry S1…Sn · unknown [S#] stripped · references built from retrieved URLs · benchmark score kept only if it appears in its source</text>
  <text x="64" y="932" font-size="15" fill="#CBD5E1">Attribution check on prose · licence category by rules (open source vs open weights) · memory = params × bytes × 1.2 · labelled fallbacks</text>
  <g font-size="13" fill="#605C5C">
    <rect x="40" y="250" width="14" height="14" fill="#0B1B29"/><text x="62" y="262">Agent (uses the model)</text>
    <rect x="226" y="250" width="14" height="14" fill="#FFFFFF" stroke="#2B2828"/><text x="248" y="262">Plain code</text>
  </g>
</svg>
