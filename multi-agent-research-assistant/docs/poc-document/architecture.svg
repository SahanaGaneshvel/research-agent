<text x="682.0" y="922" font-size="14" font-weight="400" fill="#605C5C" text-anchor="start">None. The model</text>
<text x="682.0" y="942" font-size="14" font-weight="400" fill="#605C5C" text-anchor="start">never goes online</text>
<line x1="900.0" y1="876" x2="900.0" y2="948" stroke="#2B2828" stroke-width="1"/>
<g transform="translate(928.0 886) scale(1.1666666666666667)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="2" y1="12" y2="12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" x2="6.01" y1="16" y2="16"/><line x1="10" x2="10.01" y1="16" y2="16"/></g>
