<text x="630.0" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">proposed, but not in</text>
<text x="630.0" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">the cited text</text>
<line x1="802.6666666666666" y1="752" x2="802.6666666666666" y2="822" stroke="#2B2828" stroke-width="1"/>
<text x="824.6666666666666" y="772" font-size="15" font-weight="700" fill="#2B2828" text-anchor="start">Removed sentences</text>
<text x="824.6666666666666" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">credited a source that</text>
<text x="824.6666666666666" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">never said it</text>
<line x1="997.3333333333333" y1="752" x2="997.3333333333333" y2="822" stroke="#2B2828" stroke-width="1"/>
<text x="1019.3333333333333" y="772" font-size="15" font-weight="700" fill="#2B2828" text-anchor="start">Time per run</text>
<text x="1019.3333333333333" y="794" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">seconds per agent on</text>
<text x="1019.3333333333333" y="813" font-size="13.5" font-weight="400" fill="#2B2828" text-anchor="start">a laptop CPU</text>
