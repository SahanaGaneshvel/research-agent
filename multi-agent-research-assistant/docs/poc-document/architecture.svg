<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="1000" viewBox="0 0 1216 1000" font-family="'Google Sans', 'Segoe UI', Roboto, Arial, sans-serif">
<!-- Research Agents architecture, GenAI Protos POC style. Editable: plain SVG text and shapes. -->
<rect width="1216" height="1000" fill="#FFFFFF"/>
<rect x="0.5" y="0.5" width="1215" height="999" fill="none" stroke="#E2E8F0"/>
<text x="608.0" y="62" font-size="30" font-weight="700" fill="#2B2828" text-anchor="middle">How Research Agents answers a question</text>
<text x="608.0" y="94" font-size="15" font-weight="400" fill="#605C5C" text-anchor="middle">GenAI Protos · 4 agents and 1 local model · blue outline: the local model does the work, grey: plain code</text>
<rect x="24" y="124" width="373" height="80" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<g transform="translate(46 152) scale(1.0)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></g>
<text x="88" y="158" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Your question</text>
<text x="88" y="182" font-size="14" font-weight="400" fill="#605C5C" text-anchor="start">A technical topic, in plain words</text>
<rect x="421" y="124" width="373" height="80" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<g transform="translate(443 152) scale(1.0)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g>
<text x="485" y="158" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">4 agents + 1 local model</text>
<text x="485" y="182" font-size="14" font-weight="400" fill="#605C5C" text-anchor="start">LangGraph workflow · Qwen3.5 on Ollama</text>
<rect x="818" y="124" width="373" height="80" rx="2" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/>
<g transform="translate(840 152) scale(1.0)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
<text x="882" y="158" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Cited report</text>
<text x="882" y="182" font-size="14" font-weight="400" fill="#605C5C" text-anchor="start">10 sections · every link was retrieved</text>
<text x="24" y="246" font-size="12" font-weight="700" fill="#2B2828" text-anchor="start" letter-spacing="1.5">RESEARCH THE QUESTION</text>
