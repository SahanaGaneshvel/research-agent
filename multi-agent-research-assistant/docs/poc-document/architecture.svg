<g transform="translate(42 282) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
<text x="76" y="300" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Check</text>
<line x1="76" y1="316" x2="268" y2="316" stroke="#2B2828" stroke-width="1"/>
<text x="76" y="342" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Topic: 10 to 1,000 chars</text>
<text x="76" y="364" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Ollama and model ready?</text>
<text x="76" y="386" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">If not, stop with a</text>
<text x="76" y="408" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">clear message</text>
<rect x="326" y="262" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2"/>
<g transform="translate(344 282) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
<text x="378" y="300" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Plan and search</text>
<line x1="378" y1="316" x2="570" y2="316" stroke="#2B2828" stroke-width="1"/>
<text x="378" y="342" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Model picks search terms</text>
<text x="378" y="364" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Code searches the web,</text>
<text x="378" y="386" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Hugging Face, arXiv, GitHub</text>
<text x="378" y="408" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Sources numbered S1 to Sn</text>
<rect x="628" y="262" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2"/>
<g transform="translate(646 282) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></g>
<text x="680" y="300" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Read the sources</text>
<line x1="680" y1="316" x2="872" y2="316" stroke="#2B2828" stroke-width="1"/>
<text x="680" y="342" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Code picks best passages</text>
<text x="680" y="364" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Model notes the facts</text>
<text x="680" y="386" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">in each source</text>
<text x="680" y="408" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Only facts in the text kept</text>
<rect x="930" y="262" width="262" height="180" rx="2" fill="#FFFFFF" stroke="#1F5BF0" stroke-width="2"/>
<g transform="translate(948 282) scale(0.9166666666666666)" fill="none" stroke="#2B2828" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/></g>
<text x="982" y="300" font-size="17" font-weight="700" fill="#2B2828" text-anchor="start">Compare the models</text>
<line x1="982" y1="316" x2="1174" y2="316" stroke="#2B2828" stroke-width="1"/>
<text x="982" y="342" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Chooses up to 4 models</text>
<text x="982" y="364" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">One row per model, from</text>
<text x="982" y="386" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">that model’s evidence</text>
<text x="982" y="408" font-size="14" font-weight="400" fill="#2B2828" text-anchor="start">Licence, size from APIs</text>
<line x1="294" y1="352.0" x2="312" y2="352.0" stroke="#2B2828" stroke-width="1.6"/><path d="M311 347.0 L320 352.0 L311 357.0" fill="none" stroke="#2B2828" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
